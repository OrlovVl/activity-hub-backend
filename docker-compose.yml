version: '3.8'
services:
  minio:
    image: minio/minio
    container_name: activity_hub_storage
    ports:
      - "9000:9000" # API для NestJS
      - "9001:9001" # Админка
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"