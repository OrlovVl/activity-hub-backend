# Docker Compose file for Activity Hub Backend
# Photo storage functionality has been removed

services:
  # PostgreSQL database service
  db:
    image: postgres:15-alpine
    container_name: activity_hub_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: activityhub
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg_data: