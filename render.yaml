databases:
  - name: activity-hub-db
    plan: free

services:
  # Backend API (NestJS)
  - name: activity-hub-backend
    type: web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: activity-hub-db
          property: connectionString
      # External S3-compatible storage (Cloudflare R2 / AWS S3 / Backblaze B2)
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        sync: false
      - key: JWT_SECRET
        generateValue: true

