databases:
  - name: activity-hub-db
    plan: free

services:
  - name: activity-hub-backend
    type: web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: activity-hub-db
          property: connectionString
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        sync: false
      - key: JWT_SECRET
        generateValue: true

