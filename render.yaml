databases:
  - name: activity-hub-db
    plan: free

services:
  - name: activity-hub-backend
    type: web
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && node ./dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: activity-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true